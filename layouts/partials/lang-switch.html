{{ if gt (len .AllTranslations) 1 }}
  <div class="flex items-center gap-1">
    {{ range .AllTranslations }}
      <a href="{{ .RelPermalink }}"
         class="px-2 py-1 text-xs rounded {{ if eq site.Language.Lang .Lang }}bg-accent text-white{{ else }}text-slate-400 hover:text-accent{{ end }} transition-colors">
        {{ upper .Lang }}
      </a>
    {{ end }}
  </div>
{{ end }}
