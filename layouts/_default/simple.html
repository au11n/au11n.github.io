{{ define "main" }}
  <article>
    <h1 class="text-3xl font-bold mb-8">{{ .Title }}</h1>
    <div class="prose dark:prose-invert max-w-none prose-p:leading-snug prose-li:leading-snug prose-li:my-0.5
      prose-headings:font-semibold
      prose-a:text-accent prose-a:no-underline hover:prose-a:underline">
      {{ .Content }}
    </div>
  </article>
{{ end }}
