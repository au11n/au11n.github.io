{{ define "main" }}
  <h2 class="text-2xl font-bold mb-6">{{ .Title }}</h2>

  {{ with .Content }}
    <div class="prose dark:prose-invert max-w-none mb-8">{{ . }}</div>
  {{ end }}

  <div class="flex flex-col gap-6">
    {{ range .Pages.ByWeight }}
      <article class="p-5 rounded-xl bg-white dark:bg-sidebar border border-slate-200 dark:border-slate-700 hover:border-accent dark:hover:border-accent transition-colors">
        <a href="{{ .RelPermalink }}" class="block">
          <div class="flex items-start justify-between gap-3 mb-2">
            <h3 class="text-lg font-semibold hover:text-accent transition-colors">{{ .Title }}</h3>
            {{ with .Params.status }}
              <span class="shrink-0 px-2 py-0.5 text-xs rounded-full
                {{ if or (eq . "Released") (eq . "Veroeffentlicht") (eq . "Выпущен") }}bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300
                {{ else }}bg-amber-100 dark:bg-amber-900 text-amber-700 dark:text-amber-300{{ end }}">
                {{ . }}
              </span>
            {{ end }}
          </div>
          {{ with .Params.tech }}
            <div class="flex flex-wrap gap-1.5 mb-2">
              {{ range . }}
                <span class="px-2 py-0.5 text-xs rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">{{ . }}</span>
              {{ end }}
            </div>
          {{ end }}
          {{ with .Summary }}
            <p class="text-slate-600 dark:text-slate-300 text-sm">{{ . }}</p>
          {{ end }}
        </a>
      </article>
    {{ end }}
  </div>
{{ end }}
