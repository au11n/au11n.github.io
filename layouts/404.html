{{ define "main" }}
  <div class="flex flex-col items-center justify-center min-h-[60vh] text-center">
    <h1 class="text-6xl font-bold text-accent mb-4">404</h1>
    {{ $lang := site.Language.Lang }}
    {{ if eq $lang "de" }}
      <p class="text-lg text-slate-500 dark:text-slate-400 mb-8">Seite nicht gefunden</p>
      <a href="{{ "/" | absLangURL }}" class="px-4 py-2 rounded-lg bg-accent text-white hover:opacity-90 transition-opacity">Zur Startseite</a>
    {{ else if eq $lang "ru" }}
      <p class="text-lg text-slate-500 dark:text-slate-400 mb-8">Страница не найдена</p>
      <a href="{{ "/" | absLangURL }}" class="px-4 py-2 rounded-lg bg-accent text-white hover:opacity-90 transition-opacity">На главную</a>
    {{ else }}
      <p class="text-lg text-slate-500 dark:text-slate-400 mb-8">Page not found</p>
      <a href="{{ "/" | absLangURL }}" class="px-4 py-2 rounded-lg bg-accent text-white hover:opacity-90 transition-opacity">Go home</a>
    {{ end }}
  </div>
{{ end }}
